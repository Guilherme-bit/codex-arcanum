<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="fundo" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3b2470"/>
      <stop offset="55%" stop-color="#221646"/>
      <stop offset="100%" stop-color="#0e0824"/>
    </radialGradient>
    <linearGradient id="glifo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="brilho" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#fundo)"/>

  <!-- círculos mágicos -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#c77dff" stroke-opacity="0.5" stroke-width="6"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ffd166" stroke-opacity="0.85" stroke-width="4"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#c77dff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="14 10"/>

  <!-- marcas rúnicas nos pontos cardeais -->
  <circle cx="256" cy="60"  r="7" fill="#ffd166"/>
  <circle cx="452" cy="256" r="7" fill="#c77dff"/>
  <circle cx="256" cy="452" r="7" fill="#ffd166"/>
  <circle cx="60"  cy="256" r="7" fill="#c77dff"/>

  <!-- glifo </> : código é magia -->
  <g filter="url(#brilho)" stroke="url(#glifo)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="150,196 92,256 150,316"/>
    <polyline points="362,196 420,256 362,316"/>
    <line x1="286" y1="160" x2="226" y2="352"/>
  </g>

  <!-- faíscas -->
  <g fill="#ffe9a8">
    <path d="M398 108 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z"/>
    <path d="M118 396 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" opacity="0.8"/>
  </g>
</svg>
